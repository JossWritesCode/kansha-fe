name: build

on:
    push:
        branches: [master]
    pull_request:

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn build
            # Several legacy tests are out of date; keep them visible without
            # blocking merges until they're fixed. Remove continue-on-error then.
            - run: yarn test --watchAll=false
              continue-on-error: true
              env:
                  CI: true
